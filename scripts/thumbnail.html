<!DOCTYPE html>
<!--
  카카오톡 공유 썸네일 (1200×630) 구성 — FE/public/icons/thumbnail-v2.png 의 원본.
  ⚠ 다시 만들면 파일명을 새로(thumbnail-v3.png …) 하고 FE/index.html의 og:image·twitter:image도 바꾼다.
    카카오는 이미지를 주소 단위로 보관해 같은 경로면 공유 디버거 초기화로도 바뀌지 않는다.
  첫 화면(Hero)과 같은 서체·색에 살구꽃을 양옆에 둔 가로형. 크기는 앞선 두 레포 썸네일처럼
  제목을 크게(약 112px) 두어 작은 카드에서도 읽히게 했다 — 첫 화면 비율을 그대로 옮기면 여백이 너무 크다.
  글자·로고는 가운데 630px 안에 둔다 — 카카오의 일부 화면은 썸네일을 정사각으로 자른다.

  다시 만들기: 폰트 원본 캐시(assets/font-work/)가 있어야 한다 (python scripts/prepare-fonts.py --download).
  Chrome에서 이 파일을 열고 DevTools 기기 모드를 1200×630(DPR 2)으로 맞춰 「Capture screenshot」한 뒤
  1200×630으로 줄여 저장한다. 살구꽃은 FE/src/components/common/Flower.tsx 의 Almond를 렌더링한 SVG다.
-->
