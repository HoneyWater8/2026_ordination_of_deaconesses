<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFF8F4" />
    <title>권사 임직 감사예배 · 하나로교회</title>
    <meta name="description" content="11.08 (주) 오후 2시 · 다윗성전 — 하나로교회 권사 임직 감사예배에 초대합니다." />
    <!-- 검색엔진에 올리지 않는다 — 임직자 66명의 실명·얼굴 사진이 있어 링크를 받은 사람만 보면 된다 (2026-10-25).
         사진 파일까지 막는 X-Robots-Tag 헤더는 vercel.json. 카카오톡·SNS 미리보기 스크랩은 막지 않는다
         (robots.txt를 두지 않는 이유 — 스크래퍼가 robots.txt를 따르면 공유 미리보기가 사라질 수 있다) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Kakao 공유 미리보기용 — 도메인이 바뀌면 og:url · og:image · twitter:image 세 곳을 함께 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://2026ordinationofdeaconesses.vercel.app" />
    <meta property="og:title" content="권사 임직 감사예배에 초대합니다." />
    <meta property="og:description" content="11.08 (주) 오후 2시 · 다윗성전" />
    <meta property="og:image" content="https://2026ordinationofdeaconesses.vercel.app/icons/thumbnail-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="HANARO CHURCH" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter card (보너스) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="권사 임직 감사예배에 초대합니다." />
    <meta name="twitter:description" content="11.08 (주) 오후 2시 · 다윗성전" />
    <meta name="twitter:image" content="https://2026ordinationofdeaconesses.vercel.app/icons/thumbnail-v2.png" />

    <!-- 탭 아이콘 — 첫 화면의 꽃(살구꽃). apple-touch-icon만 배경색을 깐다(iOS가 투명을 검게 채움) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icons/favicon-180.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Google Analytics 4 — 구글 표준 스니펫 그대로 (2026-10-25 측정 ID 수령).
         번들러를 거치지 않고 여기에 두는 이유: gtag는 `arguments` 객체를 dataLayer에
         push해야 하는데, 모듈로 감싸 동적 로드하면 page_view가 en 파라미터 없이
         나가 GA가 이벤트를 인식하지 못한다 (아멘 제자 17기 졸업 레포 2026-09-11).
         측정 ID는 스크립트에 노출되는 공개 값이라 하드코딩해도 무방하다.
         ?ga_debug=1 로 접속하면 DebugView에 실시간으로 찍힌다.
         in_app(사용자 속성) — 어느 앱 안에서 열었는지. 앱 안 브라우저는 출처를 넘기지 않아
         카카오톡 유입이 「직접 방문」으로 잡히므로(졸업 레포 운영 통계) 브라우저 정보로 구분한다.
         config보다 먼저 set 해야 첫 page_view에도 붙는다. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YBDXKFTNVQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      var ua = navigator.userAgent;
      gtag('set', 'user_properties', {
        in_app: /KAKAOTALK/i.test(ua) ? 'kakaotalk'
          : /NAVER\(inapp/i.test(ua) ? 'naver'
          : /BAND\//.test(ua) ? 'band'
          : /Instagram/.test(ua) ? 'instagram'
          : /FBAN|FBAV/.test(ua) ? 'facebook'
          : /; wv\)/.test(ua) ? 'other_webview'
          : 'browser',
      });
      gtag('config', 'G-YBDXKFTNVQ',
        new URLSearchParams(location.search).has('ga_debug') ? { debug_mode: true } : {});
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
